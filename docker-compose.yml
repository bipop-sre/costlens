version: '3.8'

services:
  costlens:
    build: .
    container_name: costlens
    ports:
      - "8080:8080"
    environment:
      - DB_TYPE=sqlite
      - DB_PATH=costlens.db
      - LOG_LEVEL=INFO
      - WEB_AUTH_TOKEN=${WEB_AUTH_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - ENABLED_PROVIDERS=${ENABLED_PROVIDERS:-alibaba,tencent}
      - WECHAT_WORK_BOT_ID=${WECHAT_WORK_BOT_ID:-}
      - WECHAT_WORK_BOT_SECRET=${WECHAT_WORK_BOT_SECRET:-}
      - ALIBABA_CLOUD_ACCESS_KEY_ID=${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      - ALIBABA_CLOUD_ACCESS_KEY_SECRET=${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      - ALIBABA_CLOUD_REGION=${ALIBABA_CLOUD_REGION:-cn-hangzhou}
      - TENCENT_CLOUD_SECRET_ID=${TENCENT_CLOUD_SECRET_ID:-}
      - TENCENT_CLOUD_SECRET_KEY=${TENCENT_CLOUD_SECRET_KEY:-}
      - TENCENT_CLOUD_REGION=${TENCENT_CLOUD_REGION:-ap-guangzhou}
      - AGENT_LANGUAGE=${AGENT_LANGUAGE:-zh-CN}
      - AGENT_COST_CACHE_TTL=${AGENT_COST_CACHE_TTL:-3600}
    volumes:
      - costlens-data:/app/data
      - ./costlens:/app/costlens
    restart: unless-stopped
    networks:
      - costlens-network

volumes:
  costlens-data:
    driver: local

networks:
  costlens-network:
    driver: bridge
